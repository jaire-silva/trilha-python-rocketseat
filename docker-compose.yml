services:
  db:
    container_name: "postgres_database_flask"
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin123"
      POSTGRES_DB: "postgres"
    ports:
      - "5432:5432"
    expose:
      - "5432"
    volumes:
      - postgres_database_flask:/var/lib/postgresql
      - ./init-scripts:/docker-entrypoint-initdb.d


volumes:
  postgres_database_flask:
    name: postgres_database_flask